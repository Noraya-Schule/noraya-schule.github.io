<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lehrkräftebereich</title>
  <style>
    :root { --bg:#0f1722; --karte:#1a2433; --rand:#2c3a4f; --text:#e8edf4; --leise:#a7b3c4; --akzent:#5fd38a; --farbe:#f0b35f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
    main { max-width:1000px; margin:0 auto; padding:48px 16px 64px; }
    h1 { font-size:clamp(1.9rem,4.5vw,2.8rem); margin:0 0 8px; letter-spacing:-0.01em; }
    .einleitung { color:var(--leise); margin:0 0 32px; max-width:62ch; }
    .zurueck { display:inline-block; margin-bottom:20px; color:var(--leise); text-decoration:none; }
    .zurueck:hover { color:var(--text); }
    .abschnitt { font-size:1.35rem; margin:0 0 16px; }
    .raster { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; margin-bottom:32px; }
    .spiel { background:var(--karte); border:1px solid var(--rand); border-top:4px solid var(--farbe); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:12px; }
    .spiel h3 { margin:0; font-size:1.2rem; }
    .spiel p { margin:0; color:var(--leise); }
    .knopf { text-align:center; padding:12px 18px; border-radius:10px; background:var(--farbe); color:#0c1420; font-weight:700; text-decoration:none; border:0; font-size:1rem; cursor:pointer; font-family:inherit; }
    .spiel .knopf:first-of-type { margin-top:auto; }
    .knopf.zweit { background:transparent; color:var(--farbe); border:2px solid var(--farbe); }
    .knopf:hover { filter:brightness(1.12); }
    .knopf:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #fff; outline-offset:2px; }
    .qr { display:flex; gap:10px; flex-wrap:wrap; }
    .qr figure { margin:0; text-align:center; font-size:.85rem; color:var(--leise); }
    .qr img { width:84px; height:auto; background:#fff; border-radius:6px; display:block; }
    details { background:var(--karte); border:1px solid var(--rand); border-radius:14px; padding:6px 22px; margin-bottom:16px; }
    summary { cursor:pointer; font-weight:700; font-size:1.15rem; padding:12px 0; }
    details ul { padding-left:20px; } details li { margin-bottom:8px; }
    .tabelle { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; margin-bottom:16px; font-size:.95rem; }
    th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--rand); }
    th { color:var(--leise); }
    .anmelden { max-width:420px; background:var(--karte); border:1px solid var(--rand); border-top:4px solid var(--farbe); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:12px; }
    label { font-weight:700; }
    input { font:inherit; padding:12px 14px; border-radius:10px; border:1px solid var(--rand); background:#0c1420; color:var(--text); }
    .fehler { color:#ff8a8a; min-height:1.5em; margin:0; }
    .leiste { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .abmelden { background:none; border:1px solid var(--rand); color:var(--leise); border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
    footer { margin-top:56px; padding-top:16px; border-top:1px solid var(--rand); color:var(--leise); font-size:.9rem; max-width:70ch; }
    footer a { color:var(--akzent); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <div class="leiste">
      <a class="zurueck" href="../">&larr; Startseite</a>
      <button class="abmelden" id="abmelden" hidden>Abmelden</button>
    </div>
    <form class="anmelden" id="form">
      <h1 style="font-size:1.6rem">Lehrkräftebereich</h1>
      <p style="margin:0;color:var(--leise)">Dieser Bereich ist für Lehrkräfte und mit einem Passwort geschützt. Die Inhalte sind verschlüsselt.</p>
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="knopf" type="submit" id="los">Öffnen</button>
      <p class="fehler" id="fehler" role="alert"></p>
    </form>
    <div id="inhalt" hidden></div>
    <footer>
      <p><a href="../impressum.html">Impressum</a> &middot; <a href="../datenschutz.html">Datenschutz</a></p>
    </footer>
  </main>
<script>
const CFG = {"salt": "r+d0NBHrr+mwXBzmY5/8Hw==", "iter": 310000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
async function holen(name, key) {
  const r = await fetch("daten/" + name + ".bin", { cache: "no-store" });
  if (!r.ok) throw new Error("fehlt");
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
}
async function zeigen(key) {
  const html = new TextDecoder().decode(await holen("hub.html", key));
  const box = document.getElementById("inhalt");
  box.innerHTML = html;
  box.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tabelle"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  box.hidden = false;
  document.getElementById("form").hidden = true;
  document.getElementById("abmelden").hidden = false;
}
async function ausSpeicher() {
  const raw = ss("lk-key");
  if (!raw) return;
  try { await zeigen(await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"])); } catch (e) { ss("lk-key", null); }
}
document.getElementById("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = document.getElementById("fehler"), btn = document.getElementById("los");
  f.textContent = ""; btn.disabled = true; btn.textContent = "Prüfe …";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    try { await holen("pruefung", key); } catch (e) { throw new Error("pw"); }
    ss("lk-key", ub64(await crypto.subtle.exportKey("raw", key)));
    await zeigen(key);
  } catch (e) {
    f.textContent = e.message === "pw" ? "Das Passwort stimmt nicht." : "Der Bereich konnte nicht geladen werden. Bitte die Seite neu laden.";
  }
  btn.disabled = false; btn.textContent = "Öffnen";
});
document.getElementById("abmelden").addEventListener("click", () => { ss("lk-key", null); location.reload(); });
if (!window.crypto || !crypto.subtle) document.getElementById("fehler").textContent = "Dieser Browser unterstützt die Entschlüsselung nicht. Bitte einen aktuellen Browser verwenden.";
else ausSpeicher();
</script>
</body>
</html>
