<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lehrkräftebereich</title>
  <style>
    body { margin:0; background:#0f1722; color:#e8edf4; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
    main { max-width:640px; margin:0 auto; padding:48px 16px; }
    a { color:#f0b35f; }
    .knopf { display:inline-block; margin-top:12px; padding:12px 18px; border-radius:10px; background:#f0b35f; color:#0c1420; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main id="m"><p>Wird entschlüsselt …</p></main>
<script>
const CFG = {"salt": "e6dAGlKCFs1NHtzKCHFZEA==", "iter": 310000};
const TYPEN = { pdf: "application/pdf", pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation" };
const NAMEN = { "praesentation.pdf": "Waagerechter_Wurf_Praesentation.pdf", "praesentation.pptx": "Waagerechter_Wurf_Praesentation.pptx", "spiel-atom.pdf": "Einfuehrung_Atom-Festung.pdf", "spiel-atom.pptx": "Einfuehrung_Atom-Festung.pptx", "spiel-gen.pdf": "Einfuehrung_Gen-Festung.pdf", "spiel-gen.pptx": "Einfuehrung_Gen-Festung.pptx", "spiel-gewalt.pdf": "Einfuehrung_Gewaltenteilungs-Festung.pdf", "spiel-gewalt.pptx": "Einfuehrung_Gewaltenteilungs-Festung.pptx", "spiel-interferenz.pdf": "Einfuehrung_Interferenzlabor.pdf", "spiel-interferenz.pptx": "Einfuehrung_Interferenzlabor.pptx" };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const m = document.getElementById("m");
const melden = h => { m.innerHTML = h; };
(async () => {
  const d = new URLSearchParams(location.search).get("d") || "";
  if (!/^[a-z0-9_-]+\.(html|pdf|pptx)$/.test(d)) return melden('<p>Unbekannter Inhalt.</p><a href="./">Zurück zum Lehrkräftebereich</a>');
  let raw = null; try { raw = sessionStorage.getItem("lk-key"); } catch (e) {}
  if (!raw) return melden('<p>Bitte zuerst im Lehrkräftebereich mit dem Passwort anmelden.</p><a class="knopf" href="./">Zur Anmeldung</a>');
  try {
    const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]);
    const r = await fetch("daten/" + d + ".bin", { cache: "no-store" });
    const buf = new Uint8Array(await r.arrayBuffer());
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    const ext = d.split(".").pop();
    if (ext === "html") {
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
      return;
    }
    const url = URL.createObjectURL(new Blob([plain], { type: TYPEN[ext] }));
    const name = NAMEN[d] || d;
    if (ext === "pdf") {
      melden('<p>Die Präsentation ist bereit.</p><a class="knopf" id="o" href="' + url + '">PDF öffnen</a> <a class="knopf" href="' + url + '" download="' + name + '">PDF herunterladen</a><p><a href="./">Zurück zum Lehrkräftebereich</a></p>');
      location.href = url;
    } else {
      melden('<p>Der Download startet. Falls nicht:</p><a class="knopf" id="dl" href="' + url + '" download="' + name + '">PowerPoint herunterladen</a><p><a href="./">Zurück zum Lehrkräftebereich</a></p>');
      document.getElementById("dl").click();
    }
  } catch (e) {
    melden('<p>Der Inhalt konnte nicht entschlüsselt werden. Bitte im Lehrkräftebereich ab- und wieder anmelden.</p><a class="knopf" href="./">Zum Lehrkräftebereich</a>');
  }
})();
</script>
</body>
</html>
